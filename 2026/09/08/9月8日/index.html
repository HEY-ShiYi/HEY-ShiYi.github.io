		<span class="built_in">printf</span>(<span class="string">&quot;%d &quot;</span>,L.elem[i]);</span><br><span class="line">	<span class="built_in">printf</span>(<span class="string">&quot;\n&quot;</span>);</span><br><span class="line">&#125;</span><br><span class="line">int Findelems(SqList L,int e)                       //查找函数</span><br><span class="line">&#123;</span><br><span class="line">	int i;</span><br><span class="line">	<span class="keyword">for</span>(i=0;i&lt;L.length;i++)</span><br><span class="line">		<span class="keyword">if</span>(L.elem[i]==e)</span><br><span class="line">			<span class="built_in">return</span> i+1;</span><br><span class="line">	<span class="built_in">return</span> 0;</span><br><span class="line">&#125;</span><br><span class="line">int SqListInsert(SqList *L,int i,int e)&#123;           //插入函数</span><br><span class="line">	int j;</span><br><span class="line">	<span class="keyword">if</span>(i&lt;1 || i&gt;L-&gt;length+1)<span class="built_in">return</span> 0;</span><br><span class="line">	<span class="keyword">if</span>(L-&gt;length==100)<span class="built_in">return</span> 0;</span><br><span class="line">	<span class="keyword">for</span>(j=L-&gt;length-1;j&gt;=i-1;j--)</span><br><span class="line">		L-&gt;elem[j+1]=L-&gt;elem[j];</span><br><span class="line">	L-&gt;elem[i-1]=e;</span><br><span class="line">	L-&gt;length++;</span><br><span class="line">	<span class="built_in">return</span> 1;</span><br><span class="line">		</span><br><span class="line">&#125;</span><br><span class="line">int SqListDelete(SqList *L,int i,int *e)&#123;          //删除函数</span><br><span class="line">	int j;</span><br><span class="line">	<span class="keyword">if</span>(i&lt;1 || i&gt;L-&gt;length)<span class="built_in">return</span> 0;</span><br><span class="line">	*e=L-&gt;elem[i-1];</span><br><span class="line">	<span class="keyword">for</span>(j=1;j&lt;=L-&gt;length-1;j++)</span><br><span class="line">			L-&gt;elem[j-1]=L-&gt;elem[j];</span><br><span class="line">	L-&gt;length--;</span><br><span class="line">	<span class="built_in">return</span> 1;</span><br><span class="line">&#125;</span><br><span class="line">void <span class="function"><span class="title">main</span></span>()&#123;</span><br><span class="line">	int value,pos,i;</span><br><span class="line">	SqList L;</span><br><span class="line">	InitSqList(&amp;L);</span><br><span class="line">	PrintSqList(L);</span><br><span class="line">	<span class="built_in">printf</span>(<span class="string">&quot;Please find value:&quot;</span>);</span><br><span class="line">	scanf(<span class="string">&quot;%d&quot;</span>,&amp;value);</span><br><span class="line">	i=Findelems(L,value);</span><br><span class="line">	<span class="keyword">if</span>(i)</span><br><span class="line">		<span class="built_in">printf</span>(<span class="string">&quot;Found!pos=[%d]\n&quot;</span>,i);</span><br><span class="line">	<span class="keyword">else</span></span><br><span class="line">		<span class="built_in">printf</span>(<span class="string">&quot;No Found!\n&quot;</span>);</span><br><span class="line">	<span class="built_in">printf</span>(<span class="string">&quot;Please input:pos,value\n&quot;</span>);</span><br><span class="line">	scanf(<span class="string">&quot;%d,%d&quot;</span>,&amp;pos,&amp;value);</span><br><span class="line">	<span class="keyword">if</span>(SqLinstInsert(&amp;L,pos,value))</span><br><span class="line">		PrintSqList(L);</span><br><span class="line">	<span class="keyword">else</span></span><br><span class="line">		<span class="built_in">printf</span>(<span class="string">&quot;Insert error!\n&quot;</span>);</span><br><span class="line">	<span class="built_in">printf</span>(<span class="string">&quot;Please delete pos:&quot;</span>);</span><br><span class="line">	scanf(<span class="string">&quot;%d&quot;</span>,&amp;pos);</span><br><span class="line">	<span class="keyword">if</span>(SqListDelete(&amp;L,pos,&amp;value))</span><br><span class="line">		PrintSqL
